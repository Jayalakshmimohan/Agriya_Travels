# Nginx Security Headers Configuration for Agriya Travels (SecurityHeaders.com A+ Rating)
# Add these lines inside your server block (e.g. /etc/nginx/sites-available/agriyatravels.com or /etc/nginx/conf.d/default.conf)

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.indianrailways.gov.in https://*.keralatourism.org https://*.tatnews.org https://*.tamilnadutourism.tn.gov.in https://*.karnatakatourism.org https://*.tourism.rajasthan.gov.in https://*.jktourism.jk.gov.in https://*.srilanka.travel https://*.indonesia.travel https://*.malaysia.travel; connect-src 'self' https://generativelanguage.googleapis.com https://*.google.com https://unpkg.com https://api.open-meteo.com ws: wss:; media-src 'self' data: blob:; object-src 'none'; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'self'; form-action 'self' mailto: https://wa.me https://api.whatsapp.com; base-uri 'self'; upgrade-insecure-requests;" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), display-capture=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
